# Doosan DRL Mock Controller — FOROS Simulator Pipeline
# Ports:  6086→noVNC | 5905→VNC | 7003→TCP DRL | 8769→HTTP feedback
services:
  foros_doosan:
    build:
      context: ./doosan_mock_controller
      dockerfile: Dockerfile
    container_name: foros_doosan_controller
    cpus: "0.5"
    mem_limit: "512m"
    ports:
      - "6086:6086"
      - "5905:5905"
      - "7003:7003"
      - "8769:8769"
    volumes:
      - doosan_programs:/app/programs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8769/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  doosan_programs:
    name: foros_doosan_programs
