[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:vncserver]
command=/start_vnc.sh
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/vnc.err.log
stdout_logfile=/var/log/supervisor/vnc.out.log
priority=1

[program:novnc]
command=/bin/bash -c "sleep 3 && websockify --web /opt/novnc 6081 localhost:5901"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/novnc.err.log
stdout_logfile=/var/log/supervisor/novnc.out.log
priority=2

[program:ros_core]
command=/start_ros.sh
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/ros.err.log
stdout_logfile=/var/log/supervisor/ros.out.log
priority=3
environment=DISPLAY=":1",ROS_MASTER_URI="http://localhost:11311"

[program:feedback_server]
command=/bin/bash -c "sleep 5 && source /opt/ros/noetic/setup.bash && python3 /ros1_feedback_server.py"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/feedback.err.log
stdout_logfile=/var/log/supervisor/feedback.out.log
priority=4
environment=ROS_MASTER_URI="http://localhost:11311"
