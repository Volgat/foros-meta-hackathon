[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log

[program:vncserver]
command=/bin/bash -c "vncserver :2 -geometry 1280x720 -depth 24 -rfbport 5902 -rfbauth /root/.vnc/passwd -fg"
autostart=true
autorestart=true
priority=1

[program:novnc]
command=/bin/bash -c "sleep 3 && websockify --web /usr/share/novnc 6082 localhost:5902"
autostart=true
autorestart=true
priority=2

[program:server]
command=python3 -u /app/server.py
autostart=true
autorestart=true
priority=3
